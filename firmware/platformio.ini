[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -D CONFIG_MICRO_ROS_APP_REPLACES_MICRO_ROS_ALLOCATOR
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
lib_deps = 
    https://github.com/micro-ROS/micro_ros_platformio
    
; WiFi credentials and micro-ROS agent config
; Override these in platformio.ini or set via build_flags
; -D WIFI_SSID=\"your_ssid\"
; -D WIFI_PASS=\"your_password\"
; -D AGENT_IP=\"192.168.1.100\"
; -D AGENT_PORT=\"8888\"
